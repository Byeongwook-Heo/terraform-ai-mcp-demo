name: Phase 1 credential-free validation
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install isolated validation tools
        run: bash scripts/install-validation-tools.sh
      - name: Validate without account credentials
        run: bash scripts/validate-phase1.sh
